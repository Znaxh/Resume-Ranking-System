[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "celery>=5.6.3",
    "flask>=3.1.3",
    "flask-caching>=2.3.1",
    "flask-cors>=6.0.2",
    "gunicorn>=25.3.0",
    "joblib>=1.5.3",
    "matplotlib>=3.10.8",
    "nltk>=3.9.4",
    "numpy>=2.4.3",
    "pandas>=3.0.2",
    "pypdf2>=3.0.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.26",
    "redis>=7.4.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.4.0",
    "spacy>=3.8.14",
    "torch>=2.11.0",
    "transformers>=5.5.3",
    "werkzeug>=3.1.8",
    "xgboost-cpu>=2.1.0,<3",
    "arize-phoenix>=12.25.0",
    "flask-limiter>=4.0.0",
    "langchain-core>=1.0.0",
    "langchain-groq>=1.0.0",
    "prometheus-flask-exporter>=0.23.0",
    "structlog>=25.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
